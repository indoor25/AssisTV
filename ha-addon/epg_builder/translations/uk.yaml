configuration:
  playlists:
    name: Плейлисти
    description: "M3U-плейлисти (канали): назва і посилання. Джерела фільмів і серіалів налаштовуються на сторінці аддона, розділ «Плагіни»."
  epg_urls:
    name: Джерела програми передач (XMLTV)
    description: Одне або кілька посилань .xml або .xml.gz. У разі конфлікту перемагає те, що вище.
  past_hours:
    name: Годин назад
    description: Скільки годин минулих передач тримати в плейлисті для телевізора.
  future_hours:
    name: Годин уперед
    description: На скільки годин уперед тримати програму.
  refresh_hours:
    name: Перезбирати раз на (годин)
    description: Як часто заново завантажувати плейлисти і програму передач.
  manual_map:
    name: Ручне зіставлення каналів
    description: "Рядки виду: Назва в плейлисті = id каналу EPG або назва в EPG. Зручніше — на сторінці аддона (+ Зіставити канал)."
  mqtt_ws_port:
    name: WebSocket-порт Mosquitto
    description: Цей порт аддон повідомляє телевізорам (плеєр підключається до MQTT через WebSocket).
  language:
    name: Мова
    description: Мова сторінки аддона і відповідей для голосу і чату (Assist). auto — мова Home Assistant.
  tmdb_key:
    name: Ключ TMDB
    description: "Рейтинги, жанри й описи фільмів із themoviedb.org. Ключ безкоштовний: на сайті Налаштування → API → API Key (v3 auth). Порожньо — рейтингів не буде."
  kinopoisk_key:
    name: Ключ Кінопошуку
    description: "Оцінка Кінопошуку та рецензії глядачів російською. Безкоштовний ключ — на kinopoiskapiunofficial.tech (неофіційне API). Порожньо — рецензій не буде, рейтинг залишиться лише з TMDB."
