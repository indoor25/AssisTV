configuration:
  playlists:
    name: Плейлисты
    description: "M3U-плейлисты (каналы): название и ссылка. Источники фильмов и сериалов настраиваются на странице аддона, раздел «Плагины»."
  epg_urls:
    name: Источники программы передач (XMLTV)
    description: Одна или несколько ссылок .xml или .xml.gz. При конфликте выигрывает та, что выше.
  past_hours:
    name: Часов назад
    description: Сколько часов прошедших передач держать в плейлисте для телевизора.
  future_hours:
    name: Часов вперёд
    description: На сколько часов вперёд держать программу.
  refresh_hours:
    name: Пересобирать раз в (часов)
    description: Как часто заново скачивать плейлисты и программу передач.
  manual_map:
    name: Ручное сопоставление каналов
    description: "Строки вида: Имя в плейлисте = id канала EPG или имя в EPG. Удобнее — на странице аддона (+ Сопоставить канал)."
  mqtt_ws_port:
    name: WebSocket-порт Mosquitto
    description: Этот порт аддон сообщает телевизорам (плеер подключается к MQTT через WebSocket).
  language:
    name: Язык
    description: Язык страницы аддона и ответов для голоса и чата (Assist). auto — язык Home Assistant.
  tmdb_key:
    name: Ключ TMDB
    description: "Рейтинги, жанры и описания фильмов с themoviedb.org. Ключ бесплатный: на сайте Настройки → API → API Key (v3 auth). Пусто — рейтингов не будет."
  kinopoisk_key:
    name: Ключ Кинопоиска
    description: "Оценка Кинопоиска и рецензии зрителей на русском. Бесплатный ключ — на kinopoiskapiunofficial.tech (неофициальное API). Пусто — рецензий не будет, рейтинг останется только с TMDB."
