<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AssisTV Installer</title>
<style>
:root { --bg:#0f1b2a; --card:#17273a; --line:#2a3d55; --text:#e8eef5; --dim:#9db0c4; --accent:#18bcf2; --ok:#3ecf8e; --bad:#ff6b6b; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, "Segoe UI", sans-serif; }
main { max-width:720px; margin:0 auto; padding:24px 16px 64px; }
header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
header h1 { font-size:22px; margin:0; flex:1; }
header .logo { width:40px; height:40px; border-radius:10px; background:var(--accent); display:grid; place-items:center; color:#0f1b2a; font-weight:800; font-size:22px; }
select, input[type=text] { background:#0c1622; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 10px; font:inherit; }
input[type=text] { width:100%; }
.steps { display:flex; gap:6px; margin-bottom:18px; }
.steps i { flex:1; height:4px; border-radius:2px; background:var(--line); }
.steps i.on { background:var(--accent); }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
.card h2 { margin:0 0 6px; font-size:20px; }
.card p { margin:8px 0; color:var(--dim); }
.card p.plain { color:var(--text); }
button { font:inherit; border:0; border-radius:10px; padding:11px 18px; cursor:pointer; background:var(--accent); color:#06202c; font-weight:600; }
button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); font-weight:400; }
button:disabled { opacity:.5; cursor:default; }
.row { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; align-items:center; }
.list { display:grid; gap:8px; margin:14px 0; }
.item { display:flex; gap:12px; align-items:center; width:100%; text-align:left; background:#0c1622; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-weight:400; }
.item:hover, .item.sel { border-color:var(--accent); }
.item b { display:block; }
.item small { color:var(--dim); }
.item .grow { flex:1; min-width:0; }
.tag { font-size:13px; padding:2px 8px; border-radius:20px; border:1px solid var(--line); color:var(--dim); white-space:nowrap; }
.tag.ok { color:var(--ok); border-color:var(--ok); }
ol { padding-left:22px; margin:12px 0; }
ol li { margin:8px 0; }
.ip { display:inline-block; font:700 26px ui-monospace, Consolas, monospace; letter-spacing:1px; color:var(--accent); background:#0c1622; border:1px dashed var(--accent); border-radius:10px; padding:6px 14px; margin:6px 0; }
.bar { height:10px; background:#0c1622; border-radius:5px; overflow:hidden; margin:14px 0 6px; }
.bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .3s; }
.msg { margin-top:14px; padding:12px 14px; border-radius:10px; background:#0c1622; border-left:4px solid var(--accent); }
.msg.bad { border-color:var(--bad); }
.msg.ok { border-color:var(--ok); }
pre { white-space:pre-wrap; word-break:break-word; font:13px ui-monospace, Consolas, monospace; color:var(--dim); max-height:180px; overflow:auto; margin:8px 0 0; }
.spin { display:inline-block; width:16px; height:16px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:r 1s linear infinite; vertical-align:-3px; margin-right:8px; }
@keyframes r { to { transform:rotate(360deg); } }
footer { margin-top:18px; color:var(--dim); font-size:13px; text-align:center; }
footer a { color:var(--dim); }
.hide { display:none !important; }
</style>
</head>

};

var P = {
  en: { pasteHint: 'The page after sign-in did not continue? Copy everything it shows and paste it here:', pasteBtn: 'Continue',
        quit: 'Close the installer', quitDone: 'The installer is closed. You can close this tab.',
        failHint: 'Common reasons: the package is damaged or made for another kind of device, or the app has a mistake in it. The TV\'s answer is below — the app\'s author will understand it.' },
  ru: { pasteHint: 'Страница после входа не пошла дальше? Скопируйте всё, что она показывает, и вставьте сюда:', pasteBtn: 'Продолжить',
        quit: 'Закрыть установщик', quitDone: 'Установщик закрыт. Эту вкладку можно закрыть.',
        failHint: 'Частые причины: пакет повреждён или сделан для другого устройства, либо в самом приложении ошибка. Ниже — ответ телевизора, автору приложения он будет понятен.' },
  uk: { pasteHint: 'Сторінка після входу не пішла далі? Скопіюйте все, що вона показує, і вставте сюди:', pasteBtn: 'Продовжити',
        quit: 'Закрити установник', quitDone: 'Установник закрито. Цю вкладку можна закрити.',
        failHint: 'Часті причини: пакет пошкоджений або зроблений для іншого пристрою, або в самому застосунку помилка. Нижче — відповідь телевізора, автору застосунку вона буде зрозуміла.' },
  de: { pasteHint: 'Die Seite nach der Anmeldung geht nicht weiter? Kopieren Sie alles, was sie zeigt, und fügen Sie es hier ein:', pasteBtn: 'Weiter',
        quit: 'Installer schließen', quitDone: 'Der Installer ist geschlossen. Sie können diesen Tab schließen.',
        failHint: 'Häufige Gründe: Das Paket ist beschädigt oder für ein anderes Gerät gemacht, oder die App selbst hat einen Fehler. Unten steht die Antwort des Fernsehers — der Autor der App versteht sie.' }
};
Object.keys(P).forEach(function (l) { Object.keys(P[l]).forEach(function (k) { L[l][k] = P[l][k]; }); });

var lang = (function () {
  var saved = ''; try { saved = localStorage.getItem('lang') || ''; } catch (e) {}
  var l = saved || (navigator.language || 'en').slice(0, 2).toLowerCase();
  return L[l] ? l : 'en';
})();
function t(key, p) {
  var s = (L[lang] && L[lang][key]) || L.en[key] || key;
  return s.replace(/\{(\w+)\}/g, function (m, k) { return p && p[k] !== undefined ? p[k] : ''; });
}
// сообщение об ошибке; подставляемые данные экранируются там, где текст идёт как HTML
function errText(r) { return t(L.en['e_' + r.error] ? 'e_' + r.error : 'e_internal', { d: r.detail || r.error }); }

function el(tag, attrs, kids) {
  var n = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) {
    if (k === 'text') n.textContent = attrs[k];
    else if (k === 'html') n.innerHTML = attrs[k];          // только свои строки переводов
    else if (k === 'on') Object.keys(attrs.on).forEach(function (e) { n.addEventListener(e, attrs.on[e]); });
    else if (attrs[k] !== false && attrs[k] != null) n.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
  });
  (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return n;
}
function api(method, path, body, raw) {
  var opt = { method: method, headers: { 'X-Token': TOKEN } };
  if (raw) opt.body = raw; else if (body) { opt.body = JSON.stringify(body); }
  return fetch(path, opt).then(function (r) { return r.json(); }).catch(function () { return { error: 'net' }; });
}

var S = { step: 1, tvs: null, scanning: false, tv: null, pcIp: '', known: true, dev: null, conn: null, pkg: null, mode: 'default', msg: null, result: null, work: '' };
var timer = null;
function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
function go(step) { stopTimer(); S.step = step; S.msg = null; render(); }
function msg(kind, text, pre) { S.msg = { kind: kind, text: text, pre: pre || '' }; render(); }

function render() {
  var card = document.getElementById('card');
  var bars = document.getElementById('steps').children;
  var pos = S.step <= 2 ? 1 : S.step === 3 ? 2 : S.step === 4 ? 3 : 4;
  for (var i = 0; i < bars.length; i++) bars[i].className = i < pos ? 'on' : '';
  card.textContent = '';
  document.getElementById('quit').textContent = t('quit');
  ({ 1: viewTv, 2: viewDev, 3: viewApp, 4: viewSamsung, 5: viewInstall })[S.step](card);
  if (S.msg) card.appendChild(el('div', { class: 'msg ' + S.msg.kind }, [el('div', { text: S.msg.text }), S.msg.pre ? el('pre', { text: S.msg.pre }) : null]));
}

// ---------- 1. телевизор ----------
function scan() {
  S.scanning = true; render();
  api('GET', '/api/scan').then(function (r) { S.scanning = false; S.tvs = r.tvs || []; if (r.error) S.msg = { kind: 'bad', text: errText(r) }; render(); });
}
function pickTv(host) {
  S.msg = null; S.work = 'connecting'; render();
  api('POST', '/api/tv', { host: host }).then(function (r) {
    S.work = '';
    if (r.error) return msg('bad', errText(r));
    S.tv = r.tv; S.pcIp = r.pcIp; S.known = r.known; S.dev = r;
    if (r.ready) connect(true); else go(2);
  });
}
function viewTv(card) {
  card.appendChild(el('h2', { text: t('s1') }));
  card.appendChild(el('p', { text: t('s1hint') }));
  if (S.scanning || S.work) card.appendChild(el('p', { class: 'plain' }, [el('span', { class: 'spin' }), t(S.work ? 'connecting' : 'searching')]));
  else if (S.tvs && !S.tvs.length) card.appendChild(el('p', { class: 'plain', text: t('none') }));
  var list = el('div', { class: 'list' });
  (S.tvs || []).forEach(function (tv) {
    var on = tv.developerMode === '1';
    list.appendChild(el('button', { class: 'item', disabled: !!S.work, on: { click: function () { pickTv(tv.ip); } } }, [
      el('span', { class: 'grow' }, [el('b', { text: tv.name }), el('small', { text: [tv.modelName, tv.ip].filter(Boolean).join(' · ') })]),
      tv.developerMode ? el('span', { class: 'tag' + (on ? ' ok' : ''), text: t(on ? 'devOn' : 'devOff') }) : null
    ]));
  });
  card.appendChild(list);
  var input = el('input', { type: 'text', placeholder: t('manual') + ' — 192.168.1.20', inputmode: 'decimal' });
  var submit = function () { if (input.value.trim()) pickTv(input.value.trim()); };
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  card.appendChild(input);
  card.appendChild(el('div', { class: 'row' }, [
    el('button', { text: t('next'), disabled: !!S.work, on: { click: submit } }),
    el('button', { class: 'ghost', text: t('again'), disabled: S.scanning || !!S.work, on: { click: scan } })
  ]));
}

// ---------- 2. режим разработчика ----------
function connect(fromList) {
  stopTimer(); S.work = 'connecting'; S.msg = null; render();
  api('POST', '/api/connect').then(function (r) {
    S.work = '';
    if (r.error) {
      S.step = 2; S.msg = { kind: 'bad', text: errText(r) }; render();
      return;
    }
    S.conn = r; go(3);
    if (!S.pkg) choose('default');
  });
}
function viewDev(card) {
  card.appendChild(el('h2', { text: t('s2') }));
  card.appendChild(el('p', { text: t('s2hint') }));
  card.appendChild(el('ol', {}, [
    el('li', { html: t('d1') }), el('li', { html: t('d2') }),
    el('li', {}, [el('span', { html: t('d3') }), el('br'), el('span', { class: 'ip', text: S.pcIp || '?' })]),
    el('li', { html: t('d4') })
  ]));
  var d = S.dev || {}, tv = d.tv || {};
  var note = S.work ? t('connecting') : t('waitingDev');
  if (!S.work && tv.developerMode === '1') note = tv.developerIP && tv.developerIP !== S.pcIp ? t('devWrongIp', { ip: tv.developerIP }) : t('devOkRestart');
  card.appendChild(el('p', { class: 'plain' }, [el('span', { class: 'spin' }), note]));
  card.appendChild(el('div', { class: 'row' }, [
    el('button', { text: t('tryConnect'), disabled: !!S.work, on: { click: function () { connect(); } } }),
    el('button', { class: 'ghost', text: t('back'), on: { click: function () { go(1); } } })
  ]));
  if (!timer) timer = setInterval(function () {
    if (S.step !== 2 || S.work) return;
    api('POST', '/api/tv', { host: S.tv.ip + ':' + S.tv.port }).then(function (r) {
      if (S.step !== 2 || S.work || r.error) return;
      var was = JSON.stringify(S.dev && S.dev.tv);
      S.dev = r; S.pcIp = r.pcIp || S.pcIp;
      if (r.ready && r.known) connect();
      else if (was !== JSON.stringify(r.tv)) render();
    });
  }, 4000);
}

// ---------- 3. приложение ----------
function choose(mode, arg) {
  S.mode = mode; S.msg = null;
  if (mode === 'file' && !arg) { S.pkg = null; return render(); }
  if (mode === 'github' && !arg) { S.pkg = null; return render(); }
  S.pkg = null; S.work = 'loading'; render();
  var p = mode === 'default' ? api('POST', '/api/package/default')
    : mode === 'github' ? api('POST', '/api/package/github', { repo: arg })
    : api('POST', '/api/package/file?name=' + encodeURIComponent(arg.name), null, arg);
  p.then(function (r) {
    S.work = '';
    if (r.error) return msg('bad', errText(r));
    S.pkg = r; render();
  });
}
function viewApp(card) {
  card.appendChild(el('h2', { text: t('s3') }));
  card.appendChild(el('p', { text: t('s3tv', { name: S.tv.name, ver: S.conn.platform || '?' }) }));
  var list = el('div', { class: 'list' });
  [['default', 'appDefault', 'appDefaultHint'], ['file', 'appFile', 'appFileHint'], ['github', 'appRepo', 'appRepoHint']].forEach(function (o) {
    list.appendChild(el('button', { class: 'item' + (S.mode === o[0] ? ' sel' : ''), disabled: !!S.work, on: { click: function () { choose(o[0]); } } }, [
      el('span', { class: 'grow' }, [el('b', { text: t(o[1]) }), el('small', { text: t(o[2]) })])
    ]));
  });
  card.appendChild(list);
  if (S.mode === 'file') {
    card.appendChild(el('input', { type: 'file', accept: '.wgt', on: { change: function (e) { if (e.target.files[0]) choose('file', e.target.files[0]); } } }));
  }
  if (S.mode === 'github') {
    var input = el('input', { type: 'text', placeholder: DEFAULT_REPO });
    var load = function () { if (input.value.trim()) choose('github', input.value.trim()); };
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') load(); });
    card.appendChild(input);
    card.appendChild(el('div', { class: 'row' }, [el('button', { class: 'ghost', text: t('load'), disabled: !!S.work, on: { click: load } })]));
  }
  if (S.work) card.appendChild(el('p', { class: 'plain' }, [el('span', { class: 'spin' }), t('loading')]));
  if (S.pkg) card.appendChild(el('div', { class: 'msg ok' }, [el('b', { text: t('chosen', { name: S.pkg.name, ver: S.pkg.version }) }), el('pre', { text: S.pkg.source + ' · ' + Math.round(S.pkg.size / 1024) + ' KB · ' + S.pkg.appId })]));
  card.appendChild(el('div', { class: 'row' }, [
    el('button', { text: t('install'), disabled: !S.pkg || !!S.work, on: { click: function () { if (S.conn.needSamsung && !S.conn.hasCert) go(4); else install(); } } }),
    el('button', { class: 'ghost', text: t('back'), on: { click: function () { go(1); } } })
  ]));
}

// ---------- 4. вход в Samsung ----------
function signIn() {
  var tab = window.open('about:blank', '_blank');
  api('POST', '/api/samsung/start').then(function (r) {
    if (r.error) { if (tab) tab.close(); return msg('bad', errText(r)); }
    if (tab) tab.location = r.url; else window.location.href = r.url;
    S.work = 'waitSignin'; S.msg = null; render();
    stopTimer();
    timer = setInterval(function () {
      api('GET', '/api/status').then(function (st) {
        var s = st.samsung || {};
        if (s.state === 'creating' && S.work !== 'creating') { S.work = 'creating'; render(); }
        if (s.state === 'ready') { stopTimer(); S.work = ''; S.conn.hasCert = true; install(); }
        if (s.state === 'error') { stopTimer(); S.work = ''; msg('bad', errText({ error: s.error, detail: s.error })); }
      });
    }, 1500);
  });
}
function viewSamsung(card) {
  card.appendChild(el('h2', { text: t('s4') }));
  card.appendChild(el('p', { text: t('s4hint') }));
  if (S.work) card.appendChild(el('p', { class: 'plain' }, [el('span', { class: 'spin' }), t(S.work)]));
  if (S.work === 'waitSignin') {
    var paste = el('textarea', { rows: '5', style: 'width:100%;background:#0c1622;color:#e8eef5;border:1px solid #2a3d55;border-radius:8px;padding:9px 10px;font:13px ui-monospace,Consolas,monospace' });
    card.appendChild(el('p', { text: t('pasteHint') }));
    card.appendChild(paste);
    card.appendChild(el('div', { class: 'row' }, [el('button', { class: 'ghost', text: t('pasteBtn'), on: { click: function () {
      api('POST', '/api/samsung/paste', { text: paste.value }).then(function (r) { if (r.error) msg('bad', errText(r)); });
    } } })]));
  }
  card.appendChild(el('div', { class: 'row' }, [
    el('button', { text: t('signin'), disabled: S.work === 'creating', on: { click: signIn } }),
    el('button', { class: 'ghost', text: t('back'), on: { click: function () { S.work = ''; go(3); } } })
  ]));
}

// ---------- 5. установка ----------
function install(uninstallFirst) {
  stopTimer(); S.step = 5; S.result = null; S.msg = null; S.work = 'install'; S.progress = { stage: 'signing', pct: 0 }; render();
  timer = setInterval(function () {
    api('GET', '/api/status').then(function (st) { if (S.work === 'install' && st.progress && st.progress.stage) { S.progress = st.progress; render(); } });
  }, 700);
  api('POST', '/api/install', { uninstallFirst: !!uninstallFirst }).then(function (r) {
    stopTimer(); S.work = '';
    if (r.error === 'need_samsung') { S.conn.hasCert = false; return go(4); }
    S.result = r; render();
  });
}
function viewInstall(card) {
  var r = S.result;
  if (!r) {
    card.appendChild(el('h2', { text: t('s5') }));
    var p = S.progress || {};
    card.appendChild(el('p', { class: 'plain' }, [el('span', { class: 'spin' }), t('st_' + (p.stage || 'signing'))]));
    var bar = el('div', { class: 'bar' }, [el('i')]);
    bar.firstChild.style.width = (p.pct || 0) + '%';
    card.appendChild(bar);
    return;
  }
  if (r.ok) {
    card.appendChild(el('h2', { text: '✓ ' + t('done', { name: r.app.name, ver: r.app.version }) }));
    card.appendChild(el('p', { text: t('doneHint') }));
    card.appendChild(el('div', { class: 'row' }, [
      el('button', { text: t('open'), on: { click: function () { api('POST', '/api/launch').then(function (x) { msg(x.ok ? 'ok' : 'bad', t(x.ok ? 'opened' : 'notOpened')); }); } } }),
      el('button', { class: 'ghost', text: t('more'), on: { click: function () { go(3); } } }),
      el('button', { class: 'ghost', text: t('quit'), on: { click: quit } })
    ]));
    return;
  }
  card.appendChild(el('h2', { text: r.error ? t('s5') : t('failed') }));
  card.appendChild(el('div', { class: 'msg bad' }, [
    el('div', { text: r.error ? errText(r) : (r.authorMismatch ? t('mismatch') : (r.line || '')) }),
    !r.error && !r.authorMismatch ? el('p', { text: t('failHint') }) : null,
    r.output ? el('pre', { text: r.output }) : null
  ]));
  card.appendChild(el('div', { class: 'row' }, [
    r.authorMismatch ? el('button', { text: t('replace'), on: { click: function () { install(true); } } }) : el('button', { text: t('install'), on: { click: function () { install(); } } }),
    el('button', { class: 'ghost', text: t('back'), on: { click: function () { go(3); } } })
  ]));
}

// закрыть установщик: программа завершается (и окно терминала с ней); вкладку браузер закрыть не даёт —
// window.close() срабатывает только для окон, открытых самой страницей
function quit() {
  api('POST', '/api/quit').then(function (r) {
    if (r.error && r.error !== 'net') return msg('bad', errText(r));
    stopTimer();
    var card = document.getElementById('card');
    card.textContent = '';
    card.appendChild(el('h2', { text: '✓ ' + t('quitDone') }));
    document.getElementById('steps').style.visibility = 'hidden';
    document.getElementById('quit').style.display = 'none';
    try { window.close(); } catch (e) {}
  });
}

document.getElementById('lang').value = lang;
document.getElementById('lang').addEventListener('change', function (e) {
  lang = e.target.value; try { localStorage.setItem('lang', lang); } catch (x) {}
  document.documentElement.lang = lang; render();
});
document.documentElement.lang = lang;
document.getElementById('ver').textContent = 'v' + VERSION;
document.getElementById('quit').addEventListener('click', quit);
render();
scan();
</script>
